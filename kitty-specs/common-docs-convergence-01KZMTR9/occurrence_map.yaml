mission: common-docs-convergence-01KZMTR9
change_mode: bulk_edit

# The 8 standard categories — every one carries an explicit action.
classification:
  code_symbols:
    action: none
    rationale: No code identifiers are renamed; only docs tooling is extended, not renamed.
  import_paths:
    action: none
    rationale: No Python import paths change.
  filesystem_paths:
    action: relocate
    rationale: >
      The primary edit class. Doc files/dirs move to the sanctioned section set; every move is a
      `moves:` entry below and is routed through the redirect tooling (derived map, immutable baseline).
  serialized_keys:
    action: update
    rationale: >
      Frontmatter gains `audience:` (touched pages only; NOT added to frontmatter_required_fields).
      `structural_lint_config.concern_bucket_to_section`/`guides_boundary` updated for audience routing.
      toc.yml / docfx.json / llms.txt / redirect_map.yaml entries regenerated in lockstep (single-threaded, IC-11).
  cli_commands:
    action: none
    rationale: No CLI command names change.
  user_facing_strings:
    action: rewrite
    rationale: >
      In-prose `[text](path)` links to moved pages are rewritten via relative_link_fixer; the 13
      free-text `audience:` values are migrated to resolvable catalog paths.
  tests_fixtures:
    action: update
    rationale: >
      Test path literals referencing moved docs are updated; gap_analysis.py's docs/-subdir-name
      assumptions are pinned by a test before renames (NFR-005).
  logs_telemetry:
    action: update
    rationale: >
      Runtime deprecation message in src/specify_cli/retrospective/deprecation.py references
      docs/guides/use-retrospective-learning.md — updated if that page moves.

